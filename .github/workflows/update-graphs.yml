name: Update Dhaka weather graphs

on:
  schedule:
    # 02:15 UTC is 08:15 in Dhaka, by which time the previous day is settled
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-graphs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch the latest daily data
        run: python src/fetch_dhaka.py

      - name: Build the daily high temperature graph
        run: python src/build_daily_high.py

      - name: Build the overnight low temperature graph
        run: python src/build_overnight_low.py

      - name: Build the cumulative rainfall graph
        run: python src/build_cumulative_precip.py

      - name: Commit updated data and graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data graphs
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Update Dhaka data and graphs, $(date -u +'%Y-%m-%d')"
            git push
          fi
